name: Probe page
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          rm -rf probe && mkdir -p probe/js
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          get() { echo "$1 $(curl -sS -L -A "$UA" -o "$2" -w '%{http_code}' "$1") $(wc -c < "$2")" | tee -a probe/status.txt; }
          for lang in en ja; do
            get "https://soshage.com/ggetapi/$lang/unit?order_by=rarity:desc" probe/unit_$lang.json
            get "https://soshage.com/ggetapi/$lang/series/v2" probe/series_$lang.json
          done
          for p in series icon logo series_icon; do
            for ext in webp png; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" "https://img.kusoge.xyz/ggenet/$p/series_0010.$ext")
              echo "img ggenet/$p/series_0010.$ext $code" | tee -a probe/status.txt
            done
          done
          base=https://soshage.com
          for f in /_app/immutable/entry/app.ZTq-sn81.js /_app/immutable/entry/start.CxurtY14.js; do
            get "$base$f" "probe/js/$(basename $f)"
          done
          for i in 1 2; do
            for u in $(grep -oh '\.\./[a-z]*/[A-Za-z0-9_.-]*\.js\|\./[A-Za-z0-9_.-]*\.js' probe/js/*.js | sort -u); do
              n=$(basename "$u"); [ -f "probe/js/$n" ] && continue
              case "$u" in ../*) path="/_app/immutable/${u#../}";; *) path="/_app/immutable/chunks/${u#./}";; esac
              curl -sS -A "$UA" -o "probe/js/$n" "$base$path" || true
            done
          done
          ls probe/js | wc -l | tee -a probe/status.txt
          grep -l 'series_' probe/js/*.js | tee -a probe/status.txt || true
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "Probe results" && git push origin HEAD:probe-results --force
